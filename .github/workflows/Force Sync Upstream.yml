name: Force Sync Upstream (Branch & Tags - Build on Latest Tag Only)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  force-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stable
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ======= 第一步：优先同步上游代码，并合并保留你本地仓库的 .github 配置 =======
      - name: Sync Upstream Code & Preserve Local Config
        id: sync_code
        run: |
          set -xeuo pipefail
          git remote add upstream https://github.com/reF1nd/sing-box.git
          git fetch upstream reF1nd-stable --tags --force

          if git diff --quiet HEAD upstream/reF1nd-stable -- . ':(exclude).github'; then
            echo "代码已是最新，跳过代码同步。"
          else
            echo "检测到上游代码更新，开始强行同步并保留本地 .github 配置..."
            mkdir -p /tmp/backup_config
            if [ -d ".github" ]; then
              cp -r .github/* /tmp/backup_config/
            fi

            git reset --hard upstream/reF1nd-stable

            rm -rf .github
            mkdir -p .github
            if [ "$(ls -A /tmp/backup_config/)" ]; then
              cp -r /tmp/backup_config/* .github/
            fi

            git add .
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "chore: 强制同步上游代码并保留本地 .github 配置"
              git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git stable --force
              echo "本地仓库分支已成功同步上游并更新。"
            fi
          fi

      # ======= 第二步：读取上游最新 Tag 名称，并打在你【本地仓库 HEAD】上 =======
      - name: Detect Upstream Tag Name & Tag My Own Repository
        id: tag_logic
        run: |
          set -xeuo pipefail

          NEW_TAG_FOUND=false
          LAST_TAG=""
          
          STABLE_COMMIT=$(git rev-parse upstream/reF1nd-stable)
          
          # 仅提取上游 reF1nd-stable 分支最新的 Tag 名称
          LATEST_UPSTREAM_TAG=$(git tag -l --sort=-v:refname --merged "$STABLE_COMMIT" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-reF1nd(\.[0-9]+)?$" | head -n 1 || true)

          if [ -n "$LATEST_UPSTREAM_TAG" ]; then
            echo "当前上游最新的稳定标签名称是: $LATEST_UPSTREAM_TAG"
            
            if git ls-remote --exit-code --tags origin "$LATEST_UPSTREAM_TAG" >/dev/null 2>&1; then
              echo "远程 origin 仓库已存在该标签，无需重复打标打包。"
            else
              echo "💡 确认该标签在你远程 origin 仓库中不存在！开始将该 Tag 名打在你本地仓库最新节点 (HEAD) 上..."
              
              # 🎯 关键点：打在你本地仓库刚刚提交更新后的 HEAD 节点上！
              git tag -f "$LATEST_UPSTREAM_TAG" HEAD
              git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git "$LATEST_UPSTREAM_TAG" --force
              
              NEW_TAG_FOUND=true
              LAST_TAG="$LATEST_UPSTREAM_TAG"
            fi
          else
            echo "未在上游找到符合规范的稳定标签。"
          fi
          
          if [ "$NEW_TAG_FOUND" = true ]; then
            # 提取数字版本号供 Docker 使用（如 v1.14.0-reF1nd.1 -> 1.14.0.1）
            CLEAN_VERSION=$(echo "$LAST_TAG" | sed -E 's/^v//; s/-reF1nd\././; s/-reF1nd$//')
            
            echo "TAG_UPDATED=true" >> $GITHUB_OUTPUT
            echo "VERSION_NUMBER=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
            echo "TAG_REF=${LAST_TAG}" >> $GITHUB_OUTPUT
          else
            echo "没有触发新版本打包。"
            echo "TAG_UPDATED=false" >> $GITHUB_OUTPUT
          fi

      # ======= 第三步：用刚才打在你本地仓库上的 Tag 触发你自定义的打包工作流 =======
      - name: Trigger Build via Workflow Dispatch
        if: steps.tag_logic.outputs.TAG_UPDATED == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yml', 
              ref: '${{ steps.tag_logic.outputs.TAG_REF }}', 
              inputs: {
                custom_tag: '${{ steps.tag_logic.outputs.VERSION_NUMBER }}' 
              }
            })
            console.log("成功触发 Docker 编译打包流程！");
